<!doctype html>
<!--
  TEACHER NOTE — CHAPTER 13: Browser document skeleton
  Purpose: provide stable semantic regions and element IDs for dashboard.js;
  presentation belongs in CSS and data/policy belongs in reports/server code.
  Inputs: published CSS/JS. Output: accessible navigation, inspector, activity
  drawer, and detail dialog mount points.
  CHANGE INSTRUCTIONS: IDs and classes are cross-file contracts. Update JS,
  CSS, layout tests, cache-busting versions, and these notes together.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Infrastructure Health &amp; Patch Posture</title>
  <link rel="stylesheet" href="assets/dashboard.css?v=28">
</head>
<body>
  <!-- CHAPTER 13.1 — Global identity, freshness, and manual refresh -->
  <header class="page-header">
    <div>
      <p class="eyebrow">Hackwell monitoring</p>
      <h1>Infrastructure Health &amp; Patch Posture</h1>
      <p id="dashboard-meta" class="muted">Loading reports…</p>
    </div>

    <button id="refresh-button" type="button">
      Refresh
    </button>
  </header>

  <!-- CHAPTER 13.2 — Two-pane fleet navigator and selected-node inspector -->
  <main class="fleet-workspace">
    <aside class="fleet-navigation" aria-label="Infrastructure navigation">
      <header class="navigator-heading">
        <strong>Server view</strong>
        <span id="filter-count" class="filter-count" aria-live="polite"></span>
      </header>

      <section class="fleet-list-panel" aria-label="Infrastructure hosts">
        <div
          id="host-grid"
          class="fleet-tree"
          role="tree"
          aria-label="Monitored infrastructure"
          aria-live="polite"
        ></div>
      </section>
    </aside>

    <section
      id="host-inspector"
      class="host-inspector"
      aria-label="Selected host summary"
      aria-live="polite"
    >
      <div class="inspector-empty">
        Select a host to see its summary.
      </div>
    </section>
  </main>

  <!-- CHAPTER 13.3 — Persistent fleet summary plus retractable event/action drawer -->
  <section
    id="activity-drawer"
    class="activity-drawer"
    aria-label="Fleet status, recent infrastructure events, and activity logs"
  >
    <div class="activity-drawer-top">
      <section
        id="fleet-summary"
        class="fleet-summary"
        aria-label="Fleet patch summary"
        aria-live="polite"
      >
        <div class="empty-state">Loading fleet summary…</div>
      </section>

      <button
        id="activity-drawer-toggle"
        class="activity-drawer-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="activity-drawer-body"
      >
        <span>Events</span>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="m3 10 5-5 5 5"></path>
        </svg>
      </button>
    </div>

    <div id="activity-drawer-body" class="activity-drawer-body" hidden>
      <div class="activity-drawer-grid">
        <section class="event-history-panel" aria-label="Recent infrastructure events">
          <header class="activity-log-heading">
            <strong>Recent events</strong>
            <span id="event-history-context">Loading…</span>
          </header>

          <div
            id="event-history-list"
            class="event-history-list"
            aria-live="polite"
          >
            <div class="event-history-empty">Loading event history…</div>
          </div>
        </section>

        <section class="activity-log-panel" aria-label="Dashboard activity log">
          <header class="activity-log-heading">
            <strong>Activity log</strong>
            <span id="activity-log-context">Idle</span>
          </header>

          <div
            id="health-check-status"
            class="run-status"
            role="status"
            aria-live="polite"
          >No dashboard activity yet.</div>

          <pre id="activity-log-output" class="activity-log-output">No dashboard command output yet.</pre>
        </section>
      </div>
    </div>
  </section>

  <!-- CHAPTER 13.4 — Full host detail view rendered on demand -->
  <dialog id="host-dialog">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">Host report</p>
        <h2 id="dialog-title"></h2>
      </div>

      <button
        id="dialog-close"
        class="secondary-button"
        type="button"
      >
        Close
      </button>
    </div>

    <div id="dialog-content"></div>
  </dialog>

  <!-- CHAPTER 13.5 — Application startup; bump version after JS publication -->
  <script src="assets/dashboard.js?v=31"></script>
</body>
</html>
