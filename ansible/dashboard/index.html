<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Infrastructure Health &amp; Patch Posture</title>
  <link rel="stylesheet" href="assets/dashboard.css?v=3">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Hackwell monitoring</p>
      <h1>Infrastructure Health &amp; Patch Posture</h1>
      <p id="dashboard-meta" class="muted">Loading reports…</p>
    </div>

    <button id="refresh-button" type="button">
      Refresh
    </button>
  </header>

  <section
    id="fleet-summary"
    class="fleet-summary"
    aria-label="Fleet patch summary"
    aria-live="polite"
  >
    <div class="empty-state">Loading fleet summary…</div>
  </section>

  <section class="toolbar" aria-label="Report filters">
    <label>
      <span>Find a host</span>
      <input
        id="host-search"
        type="search"
        placeholder="Search by hostname"
      >
    </label>

    <label>
      <span>Health</span>
      <select id="health-filter">
        <option value="ALL">All health states</option>
        <option value="CRITICAL">Critical</option>
        <option value="WARNING">Warning</option>
        <option value="UNREACHABLE">Unreachable</option>
        <option value="OK">OK</option>
        <option value="UNKNOWN">Unknown</option>
      </select>
    </label>

    <label>
      <span>Patch posture</span>
      <select id="patch-filter">
        <option value="ALL">All patch states</option>
        <option value="ERROR">Data error</option>
        <option value="AUTOMATION_ERROR">Automation error</option>
        <option value="AUTOMATION_OVERDUE">Automation overdue</option>
        <option value="REVIEW_REQUIRED">Review required</option>
        <option value="ACTION_NEEDED">Action needed</option>
        <option value="DATA_STALE">Data stale</option>
        <option value="REBOOT_PENDING">Reboot pending</option>
        <option value="INSTALLING">Installing</option>
        <option value="SCHEDULED">Scheduled</option>
        <option value="ROUTINE_MAINTENANCE">Routine maintenance</option>
        <option value="CURRENT">Current</option>
        <option value="UNKNOWN">Unknown</option>
      </select>
    </label>
  </section>

  <main>
    <div id="host-grid" class="host-grid" aria-live="polite"></div>
  </main>

  <dialog id="host-dialog">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">Host report</p>
        <h2 id="dialog-title"></h2>
      </div>

      <button
        id="dialog-close"
        class="secondary-button"
        type="button"
      >
        Close
      </button>
    </div>

    <div id="dialog-content"></div>
  </dialog>

  <script src="assets/dashboard.js?v=3"></script>
</body>
</html>
