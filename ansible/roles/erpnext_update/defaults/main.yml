---
# TEACHER NOTE — ERPNext CHAPTER 0: Controlled-update policy
# Purpose: keep site identity, release delay, Docker paths, backup retention,
# health endpoints, and preflight switches in one auditable configuration file.
# CHANGE INSTRUCTIONS: treat paths and container names as production contracts;
# verify check and backup modes before allowing an update-mode run.

# ERPNext controlled update settings

erpnext_update_mode: check

erpnext_site: vault.echodata.ca
erpnext_compose_file: /root/echodata-erpnext-compose.yml

erpnext_major_version: 16
erpnext_release_delay_hours: 24

erpnext_github_releases_url: >-
  https://api.github.com/repos/frappe/erpnext/releases?per_page=100

# Production Docker/Frappe paths
erpnext_backend_container: echodata-erpnext-backend-1
erpnext_bench_dir: /home/frappe/frappe-bench

erpnext_container_backup_dir: >-
  /home/frappe/frappe-bench/sites/{{ erpnext_site }}/private/backups

# Host-side backup storage on docker-ct
erpnext_backup_root: /root/backups/erpnext-auto

# Health checks
erpnext_local_url: http://127.0.0.1:8081/
erpnext_public_url: https://vault.echodata.ca/

# Minimum free disk space before an automatic update
erpnext_min_free_kb: 2097152

# Test the automatic-update path without modifying production
erpnext_update_preflight_only: false

# Number of verified pre-update backups to retain locally
erpnext_backup_retention: 2
