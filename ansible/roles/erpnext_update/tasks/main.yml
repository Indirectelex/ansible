---
# TEACHER NOTE — ERPNext CHAPTER 1: Workflow router
# Purpose: validate the requested mode, always run release checks, and enter the
# mutating update workflow only when policy says an update or preflight is due.
# CHANGE INSTRUCTIONS: keep mode validation strict and keep the check path safe;
# test both check/update branching whenever conditions change.

- name: Validate ERPNext update mode
  ansible.builtin.assert:
    that:
      - erpnext_update_mode in ['check', 'update']
    fail_msg: >-
      erpnext_update_mode must be either 'check' or 'update'.

- name: Run ERPNext release checks
  ansible.builtin.include_tasks: check.yml

- name: Run controlled ERPNext update
  ansible.builtin.include_tasks: update.yml
  when:
    - erpnext_update_mode == 'update'
    - >-
      (erpnext_update_available | bool)
      or
      (erpnext_update_preflight_only | bool)
