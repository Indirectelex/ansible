---
- name: Determine platform applicability
  ansible.builtin.set_fact:
    health_check_docker_applicable: >-
      {{ inventory_hostname in groups.get('docker_hosts', []) }}
    health_check_proxmox_applicable: >-
      {{ inventory_hostname in groups.get('proxmox_hosts', []) }}

- name: Evaluate collection results
  ansible.builtin.set_fact:
    health_check_apt_collection_failed: >-
      {{ (health_check_apt.rc | int) != 0 }}
    health_check_docker_collection_failed: >-
      {{
        health_check_docker_applicable | bool
        and (
          (health_check_docker_info.rc | default(1) | int) != 0
          or
          (
            health_check_docker_containers.rc
            | default(1)
            | int
          ) != 0
        )
      }}
    health_check_proxmox_collection_failed: >-
      {{
        health_check_proxmox_applicable | bool
        and (
          (
            health_check_proxmox_version.rc
            | default(1)
            | int
          ) != 0
          or
          (
            health_check_proxmox_storage.rc
            | default(1)
            | int
          ) != 0
        )
      }}
    health_check_proxmox_inactive_storage: >-
      {{
        health_check_proxmox_storage.stdout_lines
        | default([])
        | select('search', '\\sinactive\\s')
        | list
        if health_check_proxmox_applicable | bool
        else []
      }}

- name: Apply collection health status
  ansible.builtin.set_fact:
    health_check_overall_status: >-
      {{
        'WARNING'
        if (
          (
            health_check_docker_collection_failed | bool
            or health_check_proxmox_collection_failed | bool
            or health_check_proxmox_inactive_storage | length > 0
          )
          and health_check_overall_status != 'CRITICAL'
        )
        else health_check_overall_status
      }}

- name: Add collection results to structured report
  ansible.builtin.set_fact:
    health_check_report: >-
      {{
        health_check_report
        | combine(
            {
              'status': health_check_overall_status,
              'apt_check_rc': health_check_apt.rc,
              'apt_collection_failed':
                health_check_apt_collection_failed,
              'docker_check_rc':
                health_check_docker_info.rc
                | default('not applicable'),
              'docker_container_check_rc':
                health_check_docker_containers.rc
                | default('not applicable'),
              'docker_collection_failed':
                health_check_docker_collection_failed,
              'proxmox_version_check_rc':
                health_check_proxmox_version.rc
                | default('not applicable'),
              'proxmox_storage_check_rc':
                health_check_proxmox_storage.rc
                | default('not applicable'),
              'proxmox_collection_failed':
                health_check_proxmox_collection_failed,
              'proxmox_inactive_storage':
                health_check_proxmox_inactive_storage
            }
          )
      }}
