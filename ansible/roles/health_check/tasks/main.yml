---
# TEACHER NOTE — CHAPTER 5: Linux health pipeline
# Purpose: orchestrate one host from discovery through collection, policy,
# normalized modules, overall state, browser schema, and controller publication.
# Inputs are live command results plus defaults/inventory; outputs are the final
# health_check_report JSON object and its Markdown rendering.
# CHANGE INSTRUCTIONS: preserve stage order because later stages consume facts
# created earlier; update schema, renderer, tests, and notes for contract changes.

# CHAPTER 5.1 — Discover capability and calculate effective policy
- name: Discover host capabilities
  ansible.builtin.include_tasks: feature_discovery.yml

- name: Normalize host features and monitoring modules
  ansible.builtin.include_tasks: feature_policy.yml

# CHAPTER 5.2 — Collect universal read-only Linux evidence
# These commands establish the baseline resource/service view shared by every
# managed Linux host before optional technology modules run.
- name: Collect root filesystem usage
  ansible.builtin.command:
    argv:
      - df
      - -P
      - /
  register: health_check_disk
  changed_when: false

- name: Collect root filesystem inode usage
  ansible.builtin.command:
    argv:
      - df
      - -Pi
      - /
  register: health_check_inodes
  changed_when: false

- name: Collect readable memory information
  ansible.builtin.command:
    argv:
      - free
      - -h
  register: health_check_memory
  changed_when: false

- name: Collect system uptime and load
  ansible.builtin.command:
    argv:
      - uptime
  register: health_check_uptime
  changed_when: false

- name: Collect failed systemd services
  ansible.builtin.command:
    argv:
      - systemctl
      - --failed
      - --no-legend
      - --plain
  register: health_check_failed_services
  changed_when: false
  failed_when: false

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: health_check_reboot_required

- name: Check time synchronization
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=NTPSynchronized
      - --value
  register: health_check_time_sync
  changed_when: false
  failed_when: false

- name: Simulate available package upgrades
  ansible.builtin.command:
    argv:
      - apt-get
      - --simulate
      - upgrade
  environment:
    LC_ALL: C
  register: health_check_apt
  changed_when: false
  failed_when: false

# CHAPTER 5.3 — Build independent patch posture
# Patch posture is maintenance state, not the same thing as physical host health.
- name: Build read-only patch intelligence
  ansible.builtin.include_tasks: patch_intelligence.yml

# CHAPTER 5.4 — Load the previous trusted observation
# Historical evidence allows SMART and patch counters to distinguish stable
# WATCH conditions from active deterioration.
- name: Check for the previous host report
  ansible.builtin.stat:
    path: "{{ health_check_report_dir }}/{{ inventory_hostname }}.json"
  delegate_to: localhost
  become: false
  register: health_check_previous_report_file
  changed_when: false

- name: Read the previous host report
  ansible.builtin.slurp:
    src: "{{ health_check_report_dir }}/{{ inventory_hostname }}.json"
  delegate_to: localhost
  become: false
  register: health_check_previous_report_content
  when: health_check_previous_report_file.stat.exists | bool
  changed_when: false

- name: Normalize the previous host report
  ansible.builtin.set_fact:
    health_check_previous_report: >-
      {{
        (
          health_check_previous_report_content.content
          | default('')
          | b64decode
        )
        | safe_json_object
      }}
  changed_when: false

# CHAPTER 5.5 — Run optional technology modules
# Every enabled module appends the same check/status/summary/details contract.
- name: Initialize standardized module results
  ansible.builtin.set_fact:
    health_check_module_results: []
  changed_when: false

- name: Run Docker monitoring module
  ansible.builtin.include_tasks: modules/docker.yml

- name: Run Proxmox monitoring module
  ansible.builtin.include_tasks: modules/proxmox.yml

- name: Run Proxmox Backup Server monitoring module
  ansible.builtin.include_tasks: modules/pbs.yml

- name: Collect Proxmox guest storage identities
  ansible.builtin.include_tasks: modules/proxmox_guest_storage.yml

- name: Run ZFS monitoring module
  ansible.builtin.include_tasks: modules/zfs.yml

- name: Run SMART monitoring module
  ansible.builtin.include_tasks: modules/smart.yml

# CHAPTER 5.6 — Normalize baseline values and choose initial health
- name: Calculate health metrics
  ansible.builtin.set_fact:
    health_check_disk_percent: >-
      {{
        health_check_disk.stdout_lines[-1].split()[4]
        | replace('%', '')
        | int
      }}
    health_check_inode_percent: >-
      {{
        health_check_inodes.stdout_lines[-1].split()[4]
        | replace('%', '')
        | int
      }}
    health_check_memory_percent: >-
      {{
        (
          ansible_facts.memory_mb.real.used
          | float
          / ansible_facts.memory_mb.real.total
          | float
          * 100
        ) | round(1)
      }}
    health_check_failed_service_count: >-
      {{
        health_check_failed_services.stdout_lines
        | reject('equalto', '')
        | list
        | length
      }}
    health_check_update_count: >-
      {{
        health_check_apt.stdout_lines
        | select('match', '^Inst ')
        | list
        | length
      }}

- name: Apply failed-service allowlist
  ansible.builtin.include_tasks: service_allowlist.yml

- name: Determine overall health status
  ansible.builtin.set_fact:
    health_check_overall_status: >-
      {{
        'CRITICAL'
        if (
          health_check_disk_percent | int >= health_check_disk_critical_percent
          or health_check_inode_percent | int >= health_check_inode_critical_percent
          or health_check_memory_percent | float >= health_check_memory_critical_percent
          or (
            health_check_module_results
            | selectattr('status', 'equalto', 'critical')
            | list
            | length > 0
          )
        )
        else 'WARNING'
        if (
          health_check_disk_percent | int >= health_check_disk_warning_percent
          or health_check_inode_percent | int >= health_check_inode_warning_percent
          or health_check_memory_percent | float >= health_check_memory_warning_percent
          or health_check_failed_service_count | int > 0
          or (
            health_check_module_results
            | selectattr('status', 'equalto', 'warning')
            | list
            | length > 0
          )
        )
        else 'UNKNOWN'
        if (
          health_check_module_results
          | selectattr('status', 'equalto', 'unknown')
          | list
          | length > 0
        )
        else 'WATCH'
        if (
          health_check_module_results
          | selectattr('status', 'equalto', 'watch')
          | list
          | length > 0
        )
        else 'OK'
      }}

# CHAPTER 5.7 — Assemble the internal report model
# The following enrichment task files add thresholds/policies before the final
# browser-facing schema adapter runs.
- name: Assemble structured health report
  ansible.builtin.set_fact:
    health_check_report:
      generated_at: "{{ health_check_observed_at }}"
      host: "{{ inventory_hostname }}"
      status: "{{ health_check_overall_status }}"
      operating_system: >-
        {{ ansible_facts.distribution }}
        {{ ansible_facts.distribution_version }}
      kernel: "{{ ansible_facts.kernel }}"
      uptime_days: >-
        {{ (ansible_facts.uptime_seconds | int / 86400) | round(1) }}
      detected_features: "{{ health_check_detected_features }}"
      declared_feature_overrides: "{{ host_features | default({}) }}"
      features: "{{ health_check_effective_features }}"
      monitoring_modules: "{{ health_check_effective_modules }}"
      module_results: "{{ health_check_module_results }}"
      root_disk_percent: "{{ health_check_disk_percent }}"
      root_inode_percent: "{{ health_check_inode_percent }}"
      memory_percent: "{{ health_check_memory_percent }}"
      failed_service_count: "{{ health_check_failed_service_count }}"
      failed_services: "{{ health_check_failed_services.stdout_lines }}"
      updates_available: "{{ health_check_update_count }}"
      security_updates_available: "{{ health_check_security_update_count }}"
      regular_updates_available: "{{ health_check_regular_update_count }}"
      review_required: "{{ health_check_review_required_count }}"
      restart_sensitive: "{{ health_check_restart_sensitive_count }}"
      standard_security: "{{ health_check_standard_security_count }}"
      security_packages: "{{ health_check_security_packages }}"
      package_metadata_age_hours: >-
        {{
          health_check_apt_metadata_age_hours
          if health_check_apt_metadata_age_hours | float >= 0
          else none
        }}
      package_metadata_status: "{{ health_check_apt_metadata_status }}"
      package_metadata_source: "{{ health_check_apt_metadata_source }}"
      package_metadata_stale_hours: >-
        {{ health_check_apt_metadata_stale_hours }}
      patch_counts_trusted: "{{ health_check_patch_counts_trusted }}"
      patch_posture_status: "{{ health_check_patch_posture_status }}"
      patch_status_reasons: "{{ health_check_patch_status_reasons }}"
      patch_policy: "{{ health_check_patch_policy }}"
      security_pending_since_at: >-
        {{ health_check_security_pending_since_at }}
      security_pending_since_epoch: >-
        {{ health_check_security_pending_since_epoch }}
      security_pending_age_hours: >-
        {{ health_check_security_pending_age_hours }}
      os_update_automation_enabled: >-
        {{ health_check_os_update_automation_enabled }}
      os_metadata_automation_enabled: >-
        {{ health_check_os_metadata_automation_enabled }}
      os_update_automation_provider: >-
        {{ health_check_os_update_automation_provider }}
      os_update_service_active: >-
        {{ health_check_os_update_service_active }}
      os_update_last_attempt_at: >-
        {{ health_check_os_update_last_attempt_at }}
      os_update_last_result: >-
        {{ health_check_os_update_last_result }}
      os_update_last_exit_status: >-
        {{ health_check_os_update_last_exit_status }}
      os_update_next_attempt_at: >-
        {{ health_check_os_update_next_attempt_at }}
      os_update_automatic_reboot: >-
        {{ health_check_os_update_automatic_reboot }}
      reboot_required: "{{ health_check_reboot_required.stat.exists }}"
      time_synchronized: "{{ health_check_time_sync.stdout | default('unknown') }}"
      disk_details: "{{ health_check_disk.stdout }}"
      memory_details: "{{ health_check_memory.stdout }}"
      uptime_details: "{{ health_check_uptime.stdout }}"
      docker_applicable: >-
        {{ health_check_effective_modules.docker | bool }}
      docker_containers: >-
        {{ health_check_docker_containers.stdout | default('Not applicable') }}
      proxmox_applicable: >-
        {{ health_check_effective_modules.proxmox | bool }}
      proxmox_version: >-
        {{ health_check_proxmox_version.stdout | default('Not applicable') }}
      proxmox_storage: >-
        {{ health_check_proxmox_storage.stdout | default('Not applicable') }}
      storage_topology: >-
        {{ health_check_storage_topology_result | default({}) }}

# CHAPTER 5.8 — Enrich policy, adapt schema, and publish atomically
- name: Evaluate swap and load thresholds
  ansible.builtin.include_tasks: resource_thresholds.yml

- name: Evaluate service and time policies
  ansible.builtin.include_tasks: policy_checks.yml

- name: Evaluate collection policies
  ansible.builtin.include_tasks: collection_policy.yml

- name: Build dashboard-compatible report schema
  ansible.builtin.include_tasks: dashboard_schema.yml

- name: Ensure report directory exists on Hackwell
  ansible.builtin.file:
    path: "{{ health_check_report_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Write JSON report on Hackwell
  ansible.builtin.copy:
    content: "{{ health_check_report | to_nice_json }}\n"
    dest: "{{ health_check_report_dir }}/{{ inventory_hostname }}.json"
    mode: "0640"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Write Markdown report on Hackwell
  ansible.builtin.template:
    src: health-report.md.j2
    dest: "{{ health_check_report_dir }}/{{ inventory_hostname }}.md"
    mode: "0640"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Display health summary
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: Health {{ health_check_overall_status }}
      | Patch {{ health_check_patch_posture_status }}
      | Disk {{ health_check_disk_percent }}%
      | Inodes {{ health_check_inode_percent }}%
      | Memory {{ health_check_memory_percent }}%
      | Failed services {{ health_check_failed_service_count }}
      | Updates {{ health_check_update_count }}
      (security {{ health_check_security_update_count }})
      | Reboot {{ health_check_reboot_required.stat.exists }}
