---
# TEACHER NOTE — CHAPTER 5.5: Docker module
# Purpose: collect daemon and container visibility and append one standardized
# module result. Command failure becomes unknown rather than aborting the host.
# CHANGE INSTRUCTIONS: keep collection read-only and the standard result shape;
# add detail rendering/tests before adding new Docker evidence.

- name: Collect Docker information
  ansible.builtin.command:
    argv:
      - docker
      - info
  register: health_check_docker_info
  changed_when: false
  failed_when: false
  when: health_check_effective_modules.docker | bool

- name: Collect Docker container state
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
  register: health_check_docker_containers
  changed_when: false
  failed_when: false
  when: health_check_effective_modules.docker | bool

- name: Record Docker module result
  ansible.builtin.set_fact:
    health_check_module_results: >-
      {{
        health_check_module_results
        + [
          {
            'check': 'docker',
            'status':
              'unknown'
              if (
                health_check_docker_info.rc | default(1) | int != 0
                or health_check_docker_containers.rc | default(1) | int != 0
              )
              else 'healthy',
            'summary':
              'Docker collection unavailable'
              if (
                health_check_docker_info.rc | default(1) | int != 0
                or health_check_docker_containers.rc | default(1) | int != 0
              )
              else 'Docker collection completed',
            'details': {
              'info_rc': health_check_docker_info.rc | default(1) | int,
              'containers_rc':
                health_check_docker_containers.rc | default(1) | int
            }
          }
        ]
      }}
  when: health_check_effective_modules.docker | bool
  changed_when: false
