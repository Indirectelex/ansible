---
# TEACHER NOTE — CHAPTER 7: Patch evidence pipeline
# Purpose: determine APT metadata freshness, classify simulated upgrade lines,
# load automation evidence, preserve pending history, and derive patch posture.
# This pipeline observes cached metadata; it does not install packages.
# CHANGE INSTRUCTIONS: preserve trusted/untrusted separation and reason ordering;
# update Python filter fixtures and posture tests for classification changes.

# CHAPTER 7.1 — Establish whether cached APT evidence is fresh enough to trust
- name: Check APT update success timestamp
  ansible.builtin.stat:
    path: /var/lib/apt/periodic/update-success-stamp
  register: health_check_apt_update_stamp

- name: Find cached APT release metadata
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns:
      - "*_InRelease"
      - "*_Release"
    file_type: file
    recurse: false
  register: health_check_apt_metadata_files

- name: Read target epoch time
  ansible.builtin.command:
    argv:
      - date
      - +%s
  register: health_check_target_epoch
  changed_when: false

- name: Collect APT metadata timestamp candidates
  ansible.builtin.set_fact:
    health_check_apt_metadata_mtimes: >-
      {{
        health_check_apt_metadata_files.files
        | default([])
        | map(attribute='mtime')
        | list
      }}
    health_check_apt_security_metadata_mtimes: >-
      {{
        health_check_apt_metadata_files.files
        | default([])
        | selectattr('path', 'search', '(?i)security')
        | map(attribute='mtime')
        | list
      }}
  changed_when: false

- name: Calculate APT metadata epochs
  ansible.builtin.set_fact:
    health_check_apt_update_stamp_epoch: >-
      {{
        health_check_apt_update_stamp.stat.mtime | float
        if health_check_apt_update_stamp.stat.exists | default(false) | bool
        else 0
      }}
    health_check_apt_security_metadata_epoch: >-
      {{
        health_check_apt_security_metadata_mtimes | max | float
        if health_check_apt_security_metadata_mtimes | length > 0
        else 0
      }}
    health_check_apt_repository_metadata_epoch: >-
      {{
        health_check_apt_metadata_mtimes | max | float
        if health_check_apt_metadata_mtimes | length > 0
        else 0
      }}
    health_check_apt_security_metadata_observed: >-
      {{
        health_check_apt_security_metadata_mtimes | length > 0
      }}
  changed_when: false

- name: Select newest APT metadata evidence
  ansible.builtin.set_fact:
    health_check_apt_metadata_epoch: >-
      {{
        (
          [
            health_check_apt_update_stamp_epoch | float,
            health_check_apt_security_metadata_epoch | float
          ]
          | max
        )
        if health_check_apt_security_metadata_observed | bool
        else
        (
          [
            health_check_apt_update_stamp_epoch | float,
            health_check_apt_repository_metadata_epoch | float
          ]
          | max
        )
      }}
    health_check_apt_metadata_source: >-
      {{
        'unknown'
        if (
          health_check_apt_update_stamp_epoch | float == 0
          and health_check_apt_security_metadata_epoch | float == 0
          and health_check_apt_repository_metadata_epoch | float == 0
        )
        else 'apt_update_success_stamp'
        if (
          health_check_apt_update_stamp_epoch | float
          >= health_check_apt_security_metadata_epoch | float
          and health_check_apt_update_stamp_epoch | float
          >= health_check_apt_repository_metadata_epoch | float
        )
        else 'security_repository_index'
        if health_check_apt_security_metadata_observed | bool
        else 'repository_index'
      }}
  changed_when: false

- name: Calculate APT metadata age
  ansible.builtin.set_fact:
    health_check_apt_metadata_age_hours: >-
      {{
        (
          [
            0,
            (
              health_check_target_epoch.stdout | int
              - health_check_apt_metadata_epoch | float
            ) / 3600
          ]
          | max
          | round(1)
        )
        if health_check_apt_metadata_epoch | float > 0
        else -1
      }}
  changed_when: false

- name: Determine APT metadata freshness
  ansible.builtin.set_fact:
    health_check_apt_metadata_status: >-
      {{
        'UNKNOWN'
        if health_check_apt_metadata_age_hours | float < 0
        else 'STALE'
        if (
          health_check_apt_metadata_age_hours | float
          > health_check_apt_metadata_stale_hours | float
        )
        else 'FRESH'
      }}
  changed_when: false

# CHAPTER 7.2 — Parse and classify the simulated candidate set
- name: Classify cached APT upgrade candidates
  ansible.builtin.set_fact:
    health_check_patch_intelligence: >-
      {{
        (
          health_check_apt.stdout_lines
          | default([])
          | health_check_classify_apt_updates(
              health_check_security_origin_patterns,
              health_check_patch_review_rules,
              health_check_patch_restart_rules
            )
        )
        if health_check_apt.rc | default(1) | int == 0
        else {
          'updates_available': 0,
          'security_updates_available': 0,
          'regular_updates_available': 0,
          'review_required': 0,
          'restart_sensitive': 0,
          'standard_security': 0,
          'security_packages': {
            'review_required': [],
            'restart_sensitive': [],
            'standard_security': []
          }
        }
      }}
  changed_when: false

- name: Publish patch-intelligence facts
  ansible.builtin.set_fact:
    health_check_security_update_count: >-
      {{ health_check_patch_intelligence.security_updates_available | int }}
    health_check_regular_update_count: >-
      {{ health_check_patch_intelligence.regular_updates_available | int }}
    health_check_review_required_count: >-
      {{ health_check_patch_intelligence.review_required | int }}
    health_check_restart_sensitive_count: >-
      {{ health_check_patch_intelligence.restart_sensitive | int }}
    health_check_standard_security_count: >-
      {{ health_check_patch_intelligence.standard_security | int }}
    health_check_security_packages: >-
      {{ health_check_patch_intelligence.security_packages }}
    health_check_patch_counts_trusted: >-
      {{
        health_check_apt.rc | default(1) | int == 0
        and health_check_apt_metadata_status == 'FRESH'
        and health_check_apt_security_metadata_observed | bool
      }}
  changed_when: false

# CHAPTER 7.3 — Merge automation and historical timing evidence
- name: Inspect existing operating-system patch automation
  ansible.builtin.include_tasks: patch_automation.yml

- name: Track when active security updates were first detected
  ansible.builtin.include_tasks: patch_state.yml

- name: Determine patch ownership and automatic-attempt evidence
  ansible.builtin.set_fact:
    health_check_patch_policy: >-
      {{
        'all_security_manual_approval'
        if health_check_effective_features.proxmox | bool
        else 'os_managed_security'
        if health_check_os_update_automation_enabled | bool
        else 'monitor_only'
      }}
    health_check_automation_attempt_after_detection: >-
      {{
        health_check_os_update_last_attempt_epoch | int > 0
        and health_check_security_pending_since_epoch | int > 0
        and health_check_os_update_last_attempt_epoch | int
          > health_check_security_pending_since_epoch | int
      }}
    health_check_automation_failed_after_detection: >-
      {{
        health_check_os_update_automation_enabled | bool
        and health_check_os_update_last_attempt_epoch | int > 0
        and health_check_security_pending_since_epoch | int > 0
        and health_check_os_update_last_attempt_epoch | int
          > health_check_security_pending_since_epoch | int
        and (
          health_check_os_update_last_result != 'success'
          or health_check_os_update_last_exit_status | int != 0
        )
      }}
  changed_when: false

# CHAPTER 7.4 — Derive one posture and an ordered explanation list
- name: Determine patch-posture status
  ansible.builtin.set_fact:
    health_check_patch_posture_status: >-
      {{
        health_check_apt.rc
        | default(1)
        | health_check_determine_patch_posture(
            health_check_patch_counts_trusted,
            health_check_security_update_count,
            health_check_review_required_count,
            health_check_reboot_required.stat.exists,
            health_check_regular_update_count,
            health_check_os_update_automation_enabled,
            health_check_os_update_service_active,
            health_check_automation_attempt_after_detection,
            health_check_automation_failed_after_detection
          )
      }}
  changed_when: false

- name: Initialize patch-posture reasons
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: []
  changed_when: false

- name: Add operating-system automation patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          'Security installation is managed by '
          ~ health_check_os_update_automation_provider
        ]
      }}
  when: health_check_os_update_automation_enabled | bool
  changed_when: false

- name: Add pending-since patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          'Security updates first detected '
          ~ (health_check_security_pending_since_at | string)
        ]
      }}
  when:
    - health_check_security_update_count | int > 0
    - health_check_security_pending_since_at is not none
  changed_when: false

- name: Add scheduled automatic-attempt patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          'Next automatic attempt '
          ~ (
            health_check_os_update_next_attempt_at
            | default('unknown', true)
            | string
          )
        ]
      }}
  when: health_check_patch_posture_status == 'SCHEDULED'
  changed_when: false

- name: Add automatic installer running patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + ['Automatic installer is running']
      }}
  when: health_check_patch_posture_status == 'INSTALLING'
  changed_when: false

- name: Add overdue automatic-attempt patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + ['Security updates remain after a successful automatic attempt']
      }}
  when: health_check_patch_posture_status == 'AUTOMATION_OVERDUE'
  changed_when: false

- name: Add automatic-attempt failure patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          'Automatic update attempt failed with result '
          ~ (health_check_os_update_last_result | string)
        ]
      }}
  when: health_check_patch_posture_status == 'AUTOMATION_ERROR'
  changed_when: false

- name: Add APT failure patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{ health_check_patch_status_reasons + ['APT simulation failed'] }}
  when: health_check_apt.rc | default(1) | int != 0
  changed_when: false

- name: Add review-required patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          (health_check_review_required_count | string)
          ~ ' infrastructure-sensitive security package(s)'
        ]
      }}
  when: health_check_review_required_count | int > 0
  changed_when: false

- name: Add restart-sensitive patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          (health_check_restart_sensitive_count | string)
          ~ ' restart-sensitive security package(s)'
        ]
      }}
  when: health_check_restart_sensitive_count | int > 0
  changed_when: false

- name: Add standard-security patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          (health_check_standard_security_count | string)
          ~ ' standard security package(s)'
        ]
      }}
  when: health_check_standard_security_count | int > 0
  changed_when: false

- name: Add stale metadata patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          'APT metadata is '
          ~ (health_check_apt_metadata_status | lower)
          ~ '; cached counts may be incomplete'
        ]
      }}
  when: not health_check_patch_counts_trusted | bool
  changed_when: false

- name: Add reboot patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{ health_check_patch_status_reasons + ['Reboot already required'] }}
  when: health_check_reboot_required.stat.exists | bool
  changed_when: false

- name: Add regular-update patch reason
  ansible.builtin.set_fact:
    health_check_patch_status_reasons: >-
      {{
        health_check_patch_status_reasons
        + [
          (health_check_regular_update_count | string)
          ~ ' regular package update(s)'
        ]
      }}
  when: health_check_regular_update_count | int > 0
  changed_when: false
