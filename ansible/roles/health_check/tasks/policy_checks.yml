---
- name: Determine time synchronization compliance
  ansible.builtin.set_fact:
    health_check_time_sync_problem: >-
      {{
        health_check_require_time_sync | bool
        and (
          (health_check_time_sync.rc | int) != 0
          or (health_check_time_sync.stdout | trim) != 'yes'
        )
      }}

- name: Apply time synchronization status
  ansible.builtin.set_fact:
    health_check_overall_status: >-
      {{
        'WARNING'
        if (
          health_check_time_sync_problem | bool
          and health_check_overall_status != 'CRITICAL'
        )
        else health_check_overall_status
      }}

- name: Add policy results to structured report
  ansible.builtin.set_fact:
    health_check_report: >-
      {{
        health_check_report
        | combine(
            {
              'status': health_check_overall_status,
              'time_sync_required': health_check_require_time_sync,
              'time_sync_check_rc': health_check_time_sync.rc,
              'failed_service_count':
                health_check_failed_service_count,
              'failed_services':
                health_check_effective_failed_services,
              'ignored_failed_services':
                health_check_ignored_failed_services,
              'failed_service_allowlist':
                health_check_failed_service_allowlist
            }
          )
      }}
