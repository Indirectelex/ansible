---
# TEACHER NOTE — CHAPTER 3: Fleet declaration
# Purpose: declare host identity, connection details, functional groups, and
# intentional feature overrides. Group inheritance decides which plays run.
# Inputs: reachable management addresses and SSH identities.
# Outputs: managed_linux/truenas/monitoring_enabled host sets and host policy.
# CHANGE INSTRUCTIONS: when adding or moving a host, confirm group inheritance,
# manifest membership, optional topology placement, and a limited health run.

all:
  children:

    truenas_hosts:
      hosts:
        scale:
          ansible_host: 192.168.12.225
          ansible_user: ansible_monitor
          ansible_ssh_private_key_file: /home/hackwell/.ssh/ansible_ed25519
          ansible_become: false
          host_features:
            truenas: true
            vm: true
            zfs: true
            smart: false

    proxmox_hosts:
      hosts:
        nimbus:
          ansible_host: 192.168.12.156
          ansible_user: root
          host_features:
            proxmox: true

        zebulon:
          ansible_host: 192.168.40.6
          ansible_user: root
          host_features:
            proxmox: true

    pbs_servers:
      hosts:
        pbs:
          ansible_host: 192.168.12.157
          ansible_user: root
          host_features:
            pbs: true
            vm: true
          monitoring_modules:
            smart: false

    debian_containers:
      hosts:
        docker-ct:
          ansible_host: 192.168.40.214
          ansible_user: root
          host_features:
            docker: true
            lxc_container: true

    docker_hosts:
      hosts:
        docker-ct:

    lxc_guests:
      hosts:
        docker-ct:

    ubuntu_servers:
      hosts:
        ubuntu-server:
          ansible_host: 192.168.40.116
          ansible_user: hackwell

    managed_linux:
      children:
        proxmox_hosts:
        pbs_servers:
        debian_containers:
        ubuntu_servers:

    monitoring_enabled:
      children:
        managed_linux:
        truenas_hosts:

  vars:
    ansible_python_interpreter: /usr/bin/python3
