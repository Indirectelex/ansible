# TEACHER NOTE — CHAPTER 2: Controller foundation
# Purpose: define the default inventory, role lookup, SSH trust, concurrency,
# and privilege-escalation behaviour for every playbook launched here.
# Inputs: repository-relative inventory/roles plus the controller SSH key.
# Outputs: consistent Ansible behaviour whether invoked by a human or server.py.
# CHANGE INSTRUCTIONS: path, SSH, timeout, or become changes affect every host;
# run inventory inspection, connectivity checks, and playbook syntax checks.

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
timeout = 15
private_key_file = /home/hackwell/.ssh/ansible_ed25519

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
