---
# TEACHER NOTE — CHAPTERS 5 AND 10: Collect, then publish
# Purpose: this is the end-to-end monitoring entry point. It runs the Linux
# role, runs the TrueNAS collector, and finally publishes one coherent web root.
# Inputs: inventory groups, role defaults/overrides, live host evidence.
# Outputs: reports/*.json, reports/*.md, manifest, topology, and UI assets.
# CHANGE INSTRUCTIONS: preserve the three-play order; producer/schema changes
# require consumer tests, a syntax check, and a full publication test.

# CHAPTER 5A — Standard Linux hosts
# The connectivity preflight writes an UNREACHABLE report instead of aborting
# the entire fleet. Successful hosts then enter roles/health_check/tasks/main.yml.
- name: Check Linux system health
  hosts: managed_linux
  become: true
  gather_facts: false

  vars:
    health_check_report_dir: "{{ playbook_dir }}/../reports"

  pre_tasks:
    - name: Run connectivity preflight
      ansible.builtin.import_tasks: tasks/connectivity-check.yml

  roles:
    - role: health_check

# CHAPTER 5B — TrueNAS appliance hosts
# TrueNAS is intentionally separate because its command surface and privilege
# model differ from general Debian/Ubuntu hosts.
- name: Check TrueNAS storage health
  hosts: truenas_hosts
  become: false
  gather_facts: true

  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  vars:
    health_check_report_dir: "{{ playbook_dir }}/../reports"

  tasks:
    - name: Run TrueNAS-specific health collector
      ansible.builtin.include_role:
        name: health_check
        tasks_from: truenas

# CHAPTER 10 — Publication contract
# Source UI files are copied into reports/ so interface, manifest, host reports,
# and storage topology share one relative web root.
- name: Publish scalable monitoring dashboard
  hosts: localhost
  become: false
  gather_facts: false
  tags:
    - dashboard
  vars:
    health_dashboard_report_dir: "{{ playbook_dir }}/../reports"
    health_dashboard_source_dir: "{{ playbook_dir }}/../dashboard"

  tasks:
    - name: Ensure dashboard asset directory exists
      ansible.builtin.file:
        path: "{{ health_dashboard_report_dir }}/assets"
        state: directory
        mode: "0750"
      changed_when: false

    - name: Publish dashboard HTML
      ansible.builtin.copy:
        src: "{{ health_dashboard_source_dir }}/index.html"
        dest: "{{ health_dashboard_report_dir }}/index.html"
        mode: "0640"
      changed_when: false

    - name: Publish dashboard assets
      ansible.builtin.copy:
        src: "{{ health_dashboard_source_dir }}/assets/"
        dest: "{{ health_dashboard_report_dir }}/assets/"
        mode: "0640"
        directory_mode: "0750"
      changed_when: false

    # CHAPTER 10.1 — Publish the authoritative infrastructure registry
    # Identity/topology/service intent is maintained separately from runtime
    # reports. Validate it against Ansible inventory before exposing it through
    # the loopback control plane so drift fails publication loudly.
    - name: Load infrastructure registry source
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/infrastructure-registry.yml"
        name: health_dashboard_registry_file
      changed_when: false

    - name: Normalize infrastructure registry source
      ansible.builtin.set_fact:
        health_dashboard_registry: >-
          {{ health_dashboard_registry_file.infrastructure_registry }}
      changed_when: false

    - name: Validate infrastructure registry root contract
      ansible.builtin.assert:
        that:
          - health_dashboard_registry.schema_version | int == 1
          - health_dashboard_registry.control_plane is mapping
          - health_dashboard_registry.hosts is mapping
          - health_dashboard_registry.services is mapping
          - health_dashboard_registry.edges is mapping
        fail_msg: >-
          inventory/infrastructure-registry.yml does not satisfy registry
          schema version 1.
      changed_when: false

    - name: Require every monitored host in infrastructure registry
      ansible.builtin.assert:
        that:
          - item in health_dashboard_registry.hosts
        fail_msg: >-
          Monitored host {{ item }} is missing from
          inventory/infrastructure-registry.yml.
      loop: "{{ groups.get('monitoring_enabled', []) | sort }}"
      changed_when: false

    - name: Validate registered host identity and topology
      ansible.builtin.assert:
        that:
          - item.key in groups.get('all', [])
          - item.value.kind is string
          - item.value.management_address is string
          - >-
            item.value.management_address | string
            == hostvars[item.key].ansible_host | string
          - >-
            item.value.parent is not defined
            or item.value.parent is none
            or item.value.parent in health_dashboard_registry.hosts
          - >-
            item.value.parent is not defined
            or item.value.parent is none
            or item.value.parent != item.key
        fail_msg: >-
          Registry host {{ item.key }} is unknown to inventory, has a drifting
          management address, or has an invalid parent relationship.
      loop: "{{ health_dashboard_registry.hosts | dict2items }}"
      changed_when: false

    - name: Validate registered service relationships
      ansible.builtin.assert:
        that:
          - item.value.name is string
          - item.value.hostname is string
          - item.value.exposure in ['public', 'internal']
          - >-
            item.value.edge is not defined
            or item.value.edge is none
            or item.value.edge in health_dashboard_registry.edges
          - >-
            item.value.runtime_host is not defined
            or item.value.runtime_host is none
            or item.value.runtime_host in health_dashboard_registry.hosts
        fail_msg: >-
          Registry service {{ item.key }} has an invalid host, edge, or
          exposure relationship.
      loop: "{{ health_dashboard_registry.services | dict2items }}"
      changed_when: false

    - name: Publish infrastructure registry
      ansible.builtin.copy:
        content: >-
          {{
            health_dashboard_registry
            | combine(
                {
                  'generated_at': lookup('pipe', 'date --iso-8601=seconds')
                },
                recursive=true
              )
            | to_nice_json
          }}
        dest: "{{ health_dashboard_report_dir }}/infrastructure-registry.json"
        mode: "0640"
      changed_when: false

    - name: Initialize live storage topology publication
      ansible.builtin.set_fact:
        health_dashboard_storage_topologies: []
      changed_when: false

    - name: Add discovered Proxmox storage topologies
      ansible.builtin.set_fact:
        health_dashboard_storage_topologies: >-
          {{
            health_dashboard_storage_topologies
            + [hostvars[item].health_check_storage_topology_result]
          }}
      loop: "{{ groups.get('managed_linux', []) | sort }}"
      when:
        - hostvars[item].health_check_storage_topology_result is defined
        - >-
          hostvars[item].health_check_storage_topology_result.guests
          | default([])
          | length > 0
      changed_when: false

    - name: Write live storage topology
      ansible.builtin.copy:
        content: >-
          {{
            {
              'schema_version': 1,
              'generated_at': lookup('pipe', 'date --iso-8601=seconds'),
              'hosts': health_dashboard_storage_topologies
            }
            | to_nice_json
          }}
        dest: "{{ health_dashboard_report_dir }}/storage-topology.json"
        mode: "0640"
      changed_when: false

    - name: Initialize monitored host manifest
      ansible.builtin.set_fact:
        health_dashboard_hosts: []
      changed_when: false

    - name: Add monitored hosts to dashboard manifest
      ansible.builtin.set_fact:
        health_dashboard_hosts: >-
          {{
            health_dashboard_hosts
            + [
              {
                'id': item,
                'report': item ~ '.json',
                'markdown': item ~ '.md'
              }
            ]
          }}
      loop: "{{ groups.get('monitoring_enabled', []) | sort }}"
      changed_when: false

    - name: Write dashboard manifest
      ansible.builtin.copy:
        content: >-
          {{
            {
              'schema_version': 1,
              'generated_at':
                lookup('pipe', 'date --iso-8601=seconds'),
              'hosts': health_dashboard_hosts
            }
            | to_nice_json
          }}
        dest: "{{ health_dashboard_report_dir }}/manifest.json"
        mode: "0640"
      changed_when: false
